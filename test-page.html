<!DOCTYPE html>
<html>
<head>
    <title>Browser Test</title>
</head>
<body>
    <h1>Browser Diagnostic Test</h1>
    <div id="results"></div>
    <script>
        const results = document.getElementById('results');

        // Test 1: Basic JavaScript
        results.innerHTML += '<p>✓ JavaScript is working</p>';

        // Test 2: LocalStorage
        try {
            localStorage.setItem('test', 'value');
            localStorage.removeItem('test');
            results.innerHTML += '<p>✓ LocalStorage is working</p>';
        } catch (e) {
            results.innerHTML += '<p>✗ LocalStorage error: ' + e.message + '</p>';
        }

        // Test 3: Fetch Supabase
        const supabaseUrl = 'https://zswophakchdpxtjvthos.supabase.co';
        fetch(supabaseUrl)
            .then(() => results.innerHTML += '<p>✓ Supabase is reachable</p>')
            .catch(e => results.innerHTML += '<p>✗ Supabase error: ' + e.message + '</p>');

        // Test 4: Console check
        results.innerHTML += '<p>Open browser console (F12) and check for errors</p>';
        results.innerHTML += '<p>Then try opening: <a href="http://localhost:8081/">http://localhost:8081/</a></p>';
    </script>
</body>
</html>
